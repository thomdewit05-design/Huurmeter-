name: Voorbeeldbestanden

# Handmatig: maakt met de demowoning het PDF-dossier en de conceptbrief in de simulator en zet ze in
# docs/voorbeeld/ op de gekozen branch (alleen ontwikkelbuild; raakt geen echte gegevens).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maak:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26 kiezen
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Project genereren
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Bouwen voor de simulator
        run: |
          set -o pipefail
          xcodebuild build -project Huurmeter.xcodeproj -scheme Huurmeter -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO | grep -E "error:|BUILD" || true
          test -d "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Huurmeter.app"
      - name: In de simulator draaien en bestanden ophalen
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Huurmeter.app"
          xcrun simctl launch "$UDID" nl.huurmeter.app -demo -maakVoorbeeld -AppleLanguages "(nl)" -AppleLocale nl_NL
          DATA=$(xcrun simctl get_app_container "$UDID" nl.huurmeter.app data)
          for i in $(seq 1 60); do
            [ -f "$DATA/Documents/voorbeeld-brief.txt" ] && break
            sleep 2
          done
          mkdir -p docs/voorbeeld
          cp "$DATA/Documents/voorbeeld-dossier.pdf" "$DATA/Documents/voorbeeld-brief.txt" docs/voorbeeld/
          xcrun simctl io "$UDID" screenshot docs/voorbeeld/scherm.png || true
          # Extra schermen: ruimtes met de demowoning en met een lege woning.
          schermafbeelding() {
            xcrun simctl terminate "$UDID" nl.huurmeter.app || true
            xcrun simctl launch "$UDID" nl.huurmeter.app -demo -AppleLanguages "(nl)" -AppleLocale nl_NL "${@:2}"
            sleep 8
            xcrun simctl io "$UDID" screenshot "docs/voorbeeld/$1.png" || true
          }
          schermafbeelding ruimtes -openStap 2
          schermafbeelding ruimtes-leeg -legeWoning -openStap 2
          schermafbeelding voorzieningen -openStap 3
          ls -la docs/voorbeeld
      - name: Op de branch zetten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/voorbeeld
          git commit -m "Voorbeeldbestanden (dossier en brief) met de demowoning" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

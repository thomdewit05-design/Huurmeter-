name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Unit-tests (WWSKit, HuurmeterCore)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26 kiezen (App Store eist de iOS 26 SDK)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::Geen Xcode 26 gevonden op de runner"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: WWSKit (zonder vergelijking met de Huurprijscheck)
        working-directory: WWSKit
        run: swift test --skip FixtureTests.testFixturesKomenOvereenMetHuurprijscheck
      - name: HuurmeterCore
        working-directory: HuurmeterCore
        run: swift test

  app:
    name: iOS-app bouwen
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26 kiezen (App Store eist de iOS 26 SDK)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::Geen Xcode 26 gevonden op de runner"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: XcodeGen installeren
        run: brew install xcodegen
      - name: Project genereren
        run: xcodegen generate
      - name: Bouwen voor de simulator
        run: |
          xcodebuild build \
            -project Huurmeter.xcodeproj \
            -scheme Huurmeter \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Engelse vertalingen controleren
        run: |
          xcodebuild -exportLocalizations \
            -project Huurmeter.xcodeproj \
            -localizationPath "$RUNNER_TEMP/loc" \
            -exportLanguage en \
            CODE_SIGNING_ALLOWED=NO > export.log 2>&1 || { tail -40 export.log; exit 0; }
          XLIFF=$(find "$RUNNER_TEMP/loc" -name "en.xliff" | head -1)
          python3 scripts/controleer_vertalingen.py "$XLIFF"

  huurprijscheck:
    # Vergelijkt de voorbeeldwoningen met de officiële Huurprijscheck. Woningen zonder ingevulde uitkomst
    # worden overgeslagen (besluit Thom, afwijking van spec §4); een afwijkende ingevulde uitkomst faalt.
    name: Voorbeeldwoningen = Huurprijscheck
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26 kiezen (App Store eist de iOS 26 SDK)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::Geen Xcode 26 gevonden op de runner"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - working-directory: WWSKit
        run: swift test --filter FixtureTests

name: TestFlight

# Handmatig starten via Actions → TestFlight → Run workflow.
# Benodigde GitHub-secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      Key ID van de App Store Connect API-sleutel
#   ASC_ISSUER_ID   Issuer ID (staat boven de lijst met sleutels)
#   ASC_KEY_P8      Volledige inhoud van het gedownloade AuthKey_XXXX.p8-bestand
#   EP_ONLINE_API_KEY  (optioneel) API-sleutel van EP-Online (RVO); zonder sleutel verbergt de app de knop
# De sleutel heeft de rol "Admin" nodig, zodat Xcode zelf het distributiecertificaat en profiel kan maken.
on:
  workflow_dispatch:

jobs:
  upload:
    name: Bouwen en uploaden naar TestFlight
    runs-on: macos-15
    env:
      TEAM_ID: 7BDZ6994AD
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26 kiezen (App Store eist de iOS 26 SDK)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::Geen Xcode 26 gevonden op de runner"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Controleren of de secrets er zijn
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for naam in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!naam}" ]; then echo "::error::Secret $naam ontbreekt"; exit 1; fi
          done

      - name: XcodeGen installeren en project genereren
        run: |
          brew install xcodegen
          xcodegen generate

      - name: API-sleutel klaarzetten
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/sleutel"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/sleutel/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/sleutel/AuthKey.p8"

      - name: API-sleutel controleren bij App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 scripts/controleer_asc_sleutel.py "$RUNNER_TEMP/sleutel/AuthKey.p8"

      - name: Archiveren (Release)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Huurmeter.xcodeproj \
            -scheme Huurmeter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Huurmeter.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/sleutel/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            EP_ONLINE_API_KEY="${{ secrets.EP_ONLINE_API_KEY }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | grep -E "error:|warning: |ARCHIVE" || true
          test -d "$RUNNER_TEMP/Huurmeter.xcarchive"

      - name: Uploaden naar App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Huurmeter.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/sleutel/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Sleutel opruimen
        if: always()
        run: rm -rf "$RUNNER_TEMP/sleutel"
